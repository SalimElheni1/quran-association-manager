# Lint and every test suite that runs without a display, on each push and pull request.
# The release workflow calls it too, so no installer is built from a red tree.
#
# - unit: ESLint, then Jest with the database mocked (main process and renderer).
# - db: the handlers against a real, migrated SQLite database (`npm run test:db`). It needs the
#   Electron binary and the SQLite module rebuilt for Electron, which `npm ci` installs.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # The unit tests mock the database, so the native modules don't need building here.
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm test -- --ci

  db:
    name: Database tests (real SQLite under Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      # postinstall downloads Electron and rebuilds the SQLite module for its ABI.
      - run: npm ci
      - run: npm run test:db -- --ci
